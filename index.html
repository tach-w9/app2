<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3iba dl 7wa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col h-screen w-full justify-center items-center bg-gray-900">
    <div class="flex flex-col p-2 m-2 justify-center items-center border-[1px] border-gray-300 rounded-3xl bg-transparent h-[60%] w-[45%]"
        id="Container">
        <p class="text-center w-full font-bold text-3xl text-white">اختر طريقة لتسجيل الدخول:</p>
        <!-- Google Sign-In Custom Layout Container (Arabic/RTL) -->
        <div dir="rtl" class="w-full max-w-sm mx-auto mt-auto">
            <button type="button"
                id="google"
                class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 shadow-sm cursor-pointer">
                <!-- SVG Google Icon (Perfectly aligned for Right-To-Left layout) -->
                <svg class="w-5 h-5 min-w-[20px]" viewBox="0 0 24 24" width="24" height="24" xmlns="http://w3.org">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                        fill="#EA4335" />
                </svg>
                <!-- Arabic Button Text -->
                <span class="text-sm font-sans tracking-normal">المتابعة باستخدام Google</span>
            </button>
        </div>
        <!-- Facebook Sign-In Custom Layout Container (Arabic/RTL) -->
        <div dir="rtl" class="w-full max-w-sm mx-auto mb-auto mt-[5px]">
            <button type="button"
                id="facebook"
                class="w-full flex items-center justify-center gap-3 bg-[#1877F2] hover:bg-[#166FE5] text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 shadow-sm cursor-pointer">
                <!-- SVG Facebook Icon (Perfectly aligned for Right-To-Left layout) -->
                <svg class="w-5 h-5 min-w-[20px]" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"
                    xmlns="http://w3.org">
                    <path
                        d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                </svg>
                <!-- Arabic Button Text -->
                <span class="text-sm font-sans tracking-normal">المتابعة باستخدام فيسبوك</span>
            </button>
        </div>



    </div>
    <script>
        function id(i){
            return document.getElementById(i);
        }
        const face = id("facebook");
        const gog = id("google");
        face.addEventListener("click",()=>{
            console.log("face")
            window.location.href = "/facebook"
        });
        gog.addEventListener("click",()=>{
            console.log("gog");
            window.location.href = "/google";
        });

    </script>


</body>

</html>
